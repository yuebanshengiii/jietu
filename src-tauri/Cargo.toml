[package]
name = "screen-translator"
version = "1.0.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["macros", "global-shortcut", "clipboard-manager", "dialog", "fs", "http", "shell", "window-state"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1.0", features = ["full"] }
once_cell = "1.19"
anyhow = "1.0"
thiserror = "1.0"
base64 = "0.21"
image = "0.25"
urlencoding = "2.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Media_Ocr"] }

[target.'cfg(not(windows))'.dependencies]
tesseract = { version = "0.7", optional = true }